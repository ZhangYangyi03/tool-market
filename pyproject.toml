[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-market"
version = "0.1.0"
description = "A protocol-registered resource platform for evolvable agent tools. The enforced implementation of the AGP resource substrate, backed by autoforge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhang Yangyi" }]
keywords = ["agents", "tools", "protocol", "agp", "lifecycle", "provenance"]
dependencies = [
    "pydantic>=2.0",
    # The enforcement engine. Pinned to a git ref because the local sibling
    # checkout is a dev convenience, not something a fresh clone has. Without
    # this, `pip install -e .` succeeds and then every import of the validity
    # gate fails -- which is exactly the failure this line exists to prevent.
    "autoforge @ git+https://github.com/ZhangYangyi03/autoforge.git@main",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["toolmarket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
