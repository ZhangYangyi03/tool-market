name: reproduce

# The README makes measured claims against a pinned engine release. Running them
# here means a reader does not have to take the author's word for it on a
# machine the author owns, and that a green suite cannot quietly depend on
# local state that a fresh clone does not have.
#
# Free, and needs no secrets: the engine is fetched from the index at the
# release pyproject.toml pins, and `tools/check_pinned_engine.py` fails the build
# if what arrived is not what was pinned.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install this substrate (which pulls the pinned engine)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,grpc]"

      - name: the installed engine is the release the pin names
        run: python tools/check_pinned_engine.py

      # Same reason as in ci.yml: the stubs are generated, so a reproduction that
      # skips this step does not reproduce the suite — it reproduces the subset
      # that does not touch gRPC.
      - name: generate the gRPC stubs
        run: python tools/grpc_gen.py

      - name: substrate suite
        run: python -m pytest tests -q

      - name: engine suite, at that same pinned release
        run: |
          ver=$(python -c "import re,pathlib;print(re.search(r'autoforge-agent==([0-9][0-9A-Za-z.\-]*)', pathlib.Path('pyproject.toml').read_text()).group(1))")
          echo "engine release under test: $ver"
          mkdir -p /tmp/engine
          cd /tmp/engine
          # The sdist carries the engine's own suite; the wheel does not. Fetching
          # the source rather than the built artifact is what lets one command
          # both verify the release and run its tests -- with no git on the
          # runner and no repo URL to keep in sync with a rename.
          python -m pip download --quiet --no-deps --no-binary :all: "autoforge-agent==$ver" -d .
          tar xzf "autoforge_agent-$ver.tar.gz"
          cd "autoforge_agent-$ver"
          python -m pip install --quiet -e ".[dev]"
          python -m pytest tests -q
